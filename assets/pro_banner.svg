<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#1a0000" />
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2800" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff2800" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff2800" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes moveSpeedLine {
      0% { transform: translateX(1200px); }
      100% { transform: translateX(-1200px); }
    }
    @keyframes moveCar {
      0% { transform: translateX(-500px); }
      20% { transform: translateX(100px); }
      80% { transform: translateX(200px); }
      100% { transform: translateX(1500px); }
    }
    @keyframes flash {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #ff2800); }
    }
    @keyframes vibrate {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(1px); }
    }
    
    .speed-line-1 { animation: moveSpeedLine 1.2s linear infinite; }
    .speed-line-2 { animation: moveSpeedLine 0.8s linear infinite 0.3s; }
    .speed-line-3 { animation: moveSpeedLine 1.5s linear infinite 0.7s; }
    .speed-line-4 { animation: moveSpeedLine 0.9s linear infinite 0.1s; }
    .speed-line-5 { animation: moveSpeedLine 1.1s linear infinite 0.5s; }
    
    .car-container {
      animation: moveCar 6s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    
    .car-vibrate {
      animation: vibrate 0.05s infinite;
    }
    
    .ferrari-text {
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 80px;
      fill: #ffffff;
      opacity: 0.05;
      letter-spacing: 20px;
    }
    
    .tail-light {
      animation: flash 0.5s infinite;
    }
  </style>

  <rect width="1200" height="300" fill="url(#bg)" />

  <text x="600" y="190" text-anchor="middle" class="ferrari-text">SCUDERIA FERRARI</text>

  <rect x="0" y="240" width="1200" height="4" fill="url(#glowRed)" opacity="0.5"/>
  <rect x="0" y="250" width="1200" height="2" fill="url(#glowRed)" opacity="0.2"/>

  <g fill="#ff2800" opacity="0.6">
    <rect x="0" y="50" width="150" height="2" rx="1" class="speed-line-1" />
    <rect x="0" y="100" width="300" height="1" rx="0.5" class="speed-line-2" fill="#fff" opacity="0.3" />
    <rect x="0" y="200" width="200" height="3" rx="1.5" class="speed-line-3" />
    <rect x="0" y="270" width="100" height="2" rx="1" class="speed-line-4" />
    <rect x="0" y="150" width="250" height="1" rx="0.5" class="speed-line-5" fill="#fff" opacity="0.4"/>
  </g>

  <g class="car-container">
    <g class="car-vibrate">
      <ellipse cx="280" cy="245" rx="160" ry="10" fill="#000" opacity="0.8" />
      <image href="data:image/png;base64,{encoded_string}" x="90" y="115" width="400" height="140" />
      <circle cx="108" cy="180" r="4" fill="#ff0000" class="tail-light" />
    </g>
  </g>
</svg>