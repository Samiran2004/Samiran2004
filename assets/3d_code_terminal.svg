<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="10" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0000" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2800" />
      <stop offset="50%" stop-color="#8a0000" />
      <stop offset="100%" stop-color="#ff2800" />
    </linearGradient>
  </defs>

  <style>
    .code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 16px; }
    .keyword { fill: #ff2800; font-weight: bold; }
    .string { fill: #00ff00; }
    .comment { fill: #888888; font-style: italic; }
    .variable { fill: #ffffff; }
    .property { fill: #aaaaaa; }
    .bracket { fill: #ffcc00; }
    .terminal-bg { fill: url(#glass); stroke: url(#border); stroke-width: 3; }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g filter="url(#shadow)">
    <rect x="20" y="20" width="760" height="350" rx="15" class="terminal-bg" filter="url(#glow)"/>
    
    <!-- Window Controls -->
    <circle cx="50" cy="50" r="6" fill="#ff5f56"/>
    <circle cx="70" cy="50" r="6" fill="#ffbd2e"/>
    <circle cx="90" cy="50" r="6" fill="#27c93f"/>
    <text x="400" y="55" fill="#888" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">scuderia_source.js</text>
    <line x1="20" y1="70" x2="780" y2="70" stroke="#333" stroke-width="2"/>

    <!-- Code Content -->
    <g class="code" transform="translate(40, 110)">
      <text y="0"><tspan class="keyword">const</tspan> <tspan class="variable">F1_Driver_Profile</tspan> = <tspan class="bracket">{</tspan></text>
      <text y="30" x="30"><tspan class="property">team</tspan>          : <tspan class="string">"Scuderia Ferrari 🐎"</tspan>,</text>
      <text y="60" x="30"><tspan class="property">drivingStyle</tspan>  : <tspan class="string">"Aggressive Optimization &amp; Clean Code"</tspan>,</text>
      <text y="90" x="30"><tspan class="property">currentSector</tspan> : <tspan class="string">"Building AI-powered apps &amp; pushing flat out on DSA"</tspan>,</text>
      <text y="120" x="30"><tspan class="property">technologies</tspan>  : <tspan class="bracket">{</tspan></text>
      <text y="150" x="60"><tspan class="property">aerodynamics</tspan>: <tspan class="bracket">[</tspan><tspan class="string">"React", "Tailwind CSS", "HTML5"</tspan><tspan class="bracket">]</tspan>, <tspan class="comment">// FrontEnd</tspan></text>
      <text y="180" x="60"><tspan class="property">powerUnit</tspan>   : <tspan class="bracket">[</tspan><tspan class="string">"Node.js", "Express.js", "FastAPI"</tspan><tspan class="bracket">]</tspan>, <tspan class="comment">// BackEnd</tspan></text>
      <text y="210" x="60"><tspan class="property">intelligence</tspan>: <tspan class="bracket">[</tspan><tspan class="string">"Groq AI", "GPT", "LLM"</tspan><tspan class="bracket">]</tspan>, <tspan class="comment">// AI Strategy</tspan></text>
      <text y="240" x="60"><tspan class="property">telemetry</tspan>   : <tspan class="bracket">[</tspan><tspan class="string">"MongoDB", "Redis", "MySQL"</tspan><tspan class="bracket">]</tspan> <tspan class="comment">// Data Collection</tspan></text>
      <text y="270" x="30"><tspan class="bracket">}</tspan></text>
      <text y="300"><tspan class="bracket">}</tspan>; <tspan fill="#ff2800" class="blink">█</tspan></text>
    </g>
  </g>
</svg>
